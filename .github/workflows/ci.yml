name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Compile Python sources
        run: python -m compileall -q . -x '(^|/)(.git|.venv|venv|dist|build)/'

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set +e
          output=$(python -m pytest -q 2>&1)
          rc=$?
          echo "$output"
          if echo "$output" | grep -qE "[0-9]+ failed|[0-9]+ error"; then
            exit 1
          fi
          if [ $rc -ge 128 ]; then
            echo "Ignored signal exit ($rc) - PySide6 known issue on process teardown"
            exit 0
          fi
          exit $rc

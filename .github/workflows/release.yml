name: Build Release Artifacts

# 推送 v* 标签时自动打包 Windows EXE 和 macOS .app，
# 并作为附件上传到对应的 GitHub Release。
# 也支持在 Actions 页面手动触发（仅上传构建产物 artifact，便于测试）。
#
# 注意：本文件所有 run 命令保持纯 ASCII——中文一律放在被调用的脚本
# 文件内部（build_windows.ps1 / build_macos.sh），上传路径用通配符
# 匹配，避免 CI 环境吞掉非 ASCII 字符导致产物命名错误。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build EXE (via build_windows.ps1)
        shell: pwsh
        run: |
          $env:FC_APP_NAME = "FeishuCalendar"
          powershell -NoProfile -ExecutionPolicy Bypass -File build_windows.ps1

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: feishu-calendar-windows
          path: dist/*.exe
          if-no-files-found: error

      - name: Attach EXE to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          fail_on_unmatched_files: true

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build .app and zip (via build_macos.sh)
        run: FC_APP_NAME=FeishuCalendar bash build_macos.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: feishu-calendar-macos
          path: dist/*.zip
          if-no-files-found: error

      - name: Attach .app.zip to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          fail_on_unmatched_files: true

name: Build Release Artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest

      - name: Compile Python sources
        run: python -m compileall -q . -x '(^|/)(dist|build|\\.git)(/|$)'

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build EXE
        shell: pwsh
        run: |
          $env:FC_APP_NAME = "FeishuCalendar"
          powershell -NoProfile -ExecutionPolicy Bypass -File build_windows.ps1
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: feishu-calendar-windows
          path: dist/*.exe
          if-no-files-found: error
      - name: Attach EXE to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.exe
          fail_on_unmatched_files: true
          generate_release_notes: true

  build-macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build .app and zip
        run: FC_APP_NAME=FeishuCalendar bash build_macos.sh
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: feishu-calendar-macos
          path: dist/*.zip
          if-no-files-found: error
      - name: Attach .app.zip to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.zip
          fail_on_unmatched_files: true
          # 不要在这里开 generate_release_notes：build-windows 也会开一次，
          # 两个 job 都会往 Release 正文追加自动生成的说明，导致同一段出现两遍。
          # 只保留一处，无论哪个 job 先创建 Release，说明都只会出现一次。

  generate-checksums:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Generate incremental delta for the Windows EXE
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          new_exe="$(find artifacts -type f -name '*.exe' | head -n1)"
          if [ -z "$new_exe" ]; then
            echo "no EXE artifact found; skipping delta"
            exit 0
          fi
          delta_name="$(basename "$new_exe").delta"
          mkdir -p artifacts/delta
          # 退出码 2 = 找不到可用的上一版基座，属于正常情况（例如首个版本），
          # 此时不生成补丁，客户端自动回退到全量下载。
          # 注意用 `if ! cmd` 捕获：GitHub 默认 bash -e，裸命令失败会直接中断。
          rc=0
          if ! python tools/make_delta.py --new "$new_exe" --out "artifacts/delta/$delta_name"; then
            rc=$?
            if [ "$rc" -eq 2 ]; then
              echo "no usable base release; continuing without delta"
            else
              exit "$rc"
            fi
          fi
      - name: Attach delta to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/delta/*.delta
          fail_on_unmatched_files: false
      - name: Generate SHA256SUMS
        run: |
          find artifacts -type f \( -name '*.exe' -o -name '*.zip' -o -name '*.delta' \) \
            -exec sha256sum {} \; \
            | awk '{ name=$2; sub(/^.*\//, "", name); print $1 "  " name }' \
            > SHA256SUMS
          cat SHA256SUMS
      - name: Attach SHA256SUMS to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: SHA256SUMS
          fail_on_unmatched_files: true

name: Build Release Artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest

      - name: Compile Python sources
        run: python -m compileall -q . -x '(^|/)(dist|build|\\.git)(/|$)'

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build EXE
        shell: pwsh
        run: |
          $env:FC_APP_NAME = "FeishuCalendar"
          powershell -NoProfile -ExecutionPolicy Bypass -File build_windows.ps1
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: feishu-calendar-windows
          path: dist/*.exe
          if-no-files-found: error
      - name: Attach EXE to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          fail_on_unmatched_files: true

  build-macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build .app and zip
        run: FC_APP_NAME=FeishuCalendar bash build_macos.sh
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: feishu-calendar-macos
          path: dist/*.zip
          if-no-files-found: error
      - name: Attach .app.zip to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          fail_on_unmatched_files: true
